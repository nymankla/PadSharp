name: Release

# Push a tag like v0.2.0 to publish a release. Before tagging: set <Version> in PadSharp.csproj to the same
# number and turn [Unreleased] in CHANGELOG.md into "## [0.2.0] - <date>". See CONTRIBUTING.md, "Releasing".
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check version and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Tag, project version and changelog agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "<Version>${version}</Version>" PadSharp.csproj || { echo "PadSharp.csproj <Version> is not ${version}"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [${version}]' section"; exit 1; }

      - run: dotnet build PadSharp.slnx
      - run: dotnet test

  package:
    name: Package ${{ matrix.rid }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      # Signing runs only when these repository secrets exist; without them builds are unsigned (macOS: ad-hoc).
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish PadSharp.csproj -c Release -r ${{ matrix.rid }} -o out/PadSharp

      # ---- Windows ----
      - name: Sign (Windows)
        if: matrix.rid == 'win-x64' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 out/PadSharp/PadSharp.exe
          Remove-Item $pfx

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path out/PadSharp -DestinationPath "PadSharp-$env:VERSION-win-x64.zip"

      # ---- Linux ----
      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          cp dist/linux/install.sh dist/linux/padsharp.desktop dist/linux/padsharp.svg out/PadSharp/
          chmod +x out/PadSharp/PadSharp out/PadSharp/ed out/PadSharp/install.sh
          tar -czf "PadSharp-${VERSION}-linux-x64.tar.gz" -C out PadSharp

      # ---- macOS ----
      - name: Build PadSharp.app
        if: matrix.rid == 'osx-arm64'
        run: |
          app=out/PadSharp.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R out/PadSharp/. "$app/Contents/MacOS/"
          sed -e "s|@VERSION@|${VERSION}|g" -e "s|@BUNDLE_ID@|io.github.$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]").padsharp|g" \
            dist/macos/Info.plist > "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/PadSharp" "$app/Contents/MacOS/ed"

      - name: Sign and notarize (macOS, Developer ID)
        if: matrix.rid == 'osx-arm64' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" out/PadSharp.app
          ditto -c -k --keepParent out/PadSharp.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple out/PadSharp.app
          rm notarize.zip "$RUNNER_TEMP/cert.p12"

      - name: Ad-hoc sign (macOS, no certificate)
        if: matrix.rid == 'osx-arm64' && env.HAS_MACOS_CERT != 'true'
        run: codesign --force --deep --sign - out/PadSharp.app

      - name: Package (macOS)
        if: matrix.rid == 'osx-arm64'
        run: ditto -c -k --keepParent out/PadSharp.app "PadSharp-${VERSION}-osx-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: PadSharp-*

  release:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { if (p) exit; if (index($0, "[" v "]")) { p = 1; next } } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for ${version}"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PadSharp-* --title "PadSharp ${GITHUB_REF_NAME#v}" --notes-file notes.md
