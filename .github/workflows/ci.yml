name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      # Warnings are errors and the trim/AOT analyzers run, so the build is also the lint.
      - name: Build
        run: dotnet build PadSharp.slnx

      - name: Test
        run: dotnet test

  publish:
    name: Native AOT publish (${{ matrix.rid }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Publish
        run: dotnet publish PadSharp.csproj -c Release -r ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: PadSharp-${{ matrix.rid }}
          path: bin/Release/net11.0/${{ matrix.rid }}/publish/
